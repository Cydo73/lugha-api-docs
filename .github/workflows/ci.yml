name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r docs/requirements.txt

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the generated files are up to date
        run: |
          python scripts/export_openapi.py
          python scripts/build_reference.py
          git diff --exit-code openapi/openapi.yaml docs/api-reference.md

      - name: Build the docs
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
