name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build every language
        run: |
          # English is the site root. Every other language gets its own folder.
          python -m sphinx -W --keep-going -b html -d /tmp/doctrees/en -D language=en docs _site
          for lang in fr pt sw zu yo ar; do
            python -m sphinx -W --keep-going -b html -d /tmp/doctrees/$lang -D language=$lang docs _site/$lang
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
